}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;sabana-schools&quot;&gt;
  &lt;h2&gt;Colegios de Sabana de Occidente&lt;/h2&gt;
  &lt;div class=&quot;text-small&quot;&gt;2021–2025 · Funza, Madrid, Mosquera y Bojacá · 476 registros de GIP&lt;/div&gt;

    &lt;fieldset&gt;&lt;legend&gt;Municipios&lt;/legend&gt;&lt;div id=&quot;school-towns&quot; class=&quot;viz-row&quot;&gt;&lt;/div&gt;&lt;/fieldset&gt;

    &lt;div class=&quot;viz-controls&quot;&gt;
      &lt;label class=&quot;form-label&quot;&gt;Naturaleza&lt;select id=&quot;school-nature&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;all&quot;&gt;Oficiales y no oficiales&lt;/option&gt;&lt;option value=&quot;OFICIAL&quot;&gt;Oficiales&lt;/option&gt;&lt;option value=&quot;NO OFICIAL&quot;&gt;No oficiales&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;Jornadas&lt;select id=&quot;school-session&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;diurnal&quot;&gt;Diurnas (mañana, tarde, completa, única)&lt;/option&gt;&lt;option value=&quot;all&quot;&gt;Todas las jornadas&lt;/option&gt;&lt;option value=&quot;MAÑANA&quot;&gt;Mañana&lt;/option&gt;&lt;option value=&quot;TARDE&quot;&gt;Tarde&lt;/option&gt;&lt;option value=&quot;COMPLETA&quot;&gt;Completa&lt;/option&gt;&lt;option value=&quot;ÚNICA&quot;&gt;Única&lt;/option&gt;&lt;option value=&quot;NOCTURNA&quot;&gt;Nocturna&lt;/option&gt;&lt;option value=&quot;FIN DE SEMANA&quot;&gt;Fin de semana&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;Historia requerida&lt;select id=&quot;school-coverage&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;complete&quot;&gt;Todos los años seleccionados&lt;/option&gt;&lt;option value=&quot;available&quot;&gt;Al menos un año seleccionado&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;Mínimo de evaluados por año con datos&lt;input id=&quot;school-min&quot; type=&quot;number&quot; class=&quot;form-control&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;Peso de los años&lt;select id=&quot;school-aggregation&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;equal&quot;&gt;Cada año pesa igual&lt;/option&gt;&lt;option value=&quot;students&quot;&gt;Según estudiantes evaluados&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;hr&gt;
  &lt;h3&gt;Pesos de las materias&lt;/h3&gt;
  &lt;div class=&quot;text-small&quot;&gt;Pesos relativos · participación normalizada a 100 %&lt;/div&gt;
  &lt;div id=&quot;school-weights&quot; class=&quot;weight-grid&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;viz-row&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-preset=&quot;equal&quot;&gt;Iguales&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-preset=&quot;english&quot;&gt;Más inglés&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-preset=&quot;stem&quot;&gt;Ciencias y matemáticas&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;school-set-reference&quot;&gt;Fijar estos pesos como referencia&lt;/button&gt;
  &lt;/div&gt;
  &lt;div id=&quot;school-reference&quot; class=&quot;text-small&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;school-error&quot; class=&quot;text-destructive&quot; role=&quot;alert&quot; hidden&gt;&lt;/div&gt;
  &lt;div id=&quot;school-status&quot; class=&quot;status-line tabular-nums&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;school-results&quot;&gt;
    &lt;h3&gt;Ranking del escenario&lt;/h3&gt;
    &lt;div class=&quot;text-small&quot;&gt;Δ posición frente a los pesos de referencia · positivo = sube · evaluados acumulados = suma de cohortes&lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot; id=&quot;school-ranking&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Comparar&lt;/th&gt;&lt;th&gt;Posición&lt;/th&gt;&lt;th&gt;Colegio / municipio&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Escenario&lt;br&gt;/ 100&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Δ posición&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;TOTAL&lt;br&gt;/ 500&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Lectura&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Matem.&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Sociales&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Ciencias&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Inglés&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Años&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Evaluados acumulados&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Mínimo / año&lt;/th&gt;&lt;th class=&quot;text-end&quot; id=&quot;school-change-heading&quot;&gt;Cambio entre extremos&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;school-more&quot;&gt;Ver todos los colegios&lt;/button&gt;

      &lt;label class=&quot;form-label&quot;&gt;Medida de la evolución&lt;select id=&quot;school-metric&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;score&quot;&gt;Escenario / 100&lt;/option&gt;&lt;option value=&quot;total&quot;&gt;TOTAL / 500&lt;/option&gt;&lt;option value=&quot;0&quot;&gt;Lectura crítica / 100&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;Matemáticas / 100&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;Sociales y ciudadanas / 100&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;Ciencias naturales / 100&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;Inglés / 100&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
    &lt;/div&gt;

    &lt;div id=&quot;school-legend&quot; class=&quot;series-legend&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;plot-grid&quot;&gt;
      &lt;section&gt;&lt;h3&gt;Evolución anual&lt;/h3&gt;&lt;div id=&quot;school-trend&quot; class=&quot;chart-host&quot;&gt;&lt;/div&gt;&lt;/section&gt;
      &lt;section&gt;&lt;h3&gt;Estudiantes evaluados por año&lt;/h3&gt;&lt;div id=&quot;school-cohorts&quot; class=&quot;chart-host&quot;&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;/div&gt;
    &lt;h3&gt;Perfil por materia en el periodo seleccionado&lt;/h3&gt;
    &lt;div class=&quot;text-small&quot;&gt;Puntajes / 100 · mismos pesos de los años que el ranking · las materias conservan su puntaje original&lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot; id=&quot;school-profile&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Colegio&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Lectura crítica&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Matemáticas&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Sociales y ciudadanas&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Ciencias naturales&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Inglés&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div id=&quot;school-profile-scale&quot; class=&quot;text-small&quot;&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Valores anuales de los colegios comparados&lt;/summary&gt;&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot; id=&quot;school-annual&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Colegio&lt;/th&gt;&lt;th&gt;Año&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Evaluados&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Escenario&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;TOTAL&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Lectura&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Matem.&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Sociales&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Ciencias&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Inglés&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;details&gt;&lt;summary&gt;Definiciones, cobertura y fuente&lt;/summary&gt;
    &lt;dl class=&quot;method-list&quot;&gt;
      &lt;dt&gt;Base&lt;/dt&gt;&lt;dd&gt;476 registros · 95 nombres institucionales · versión verificada 2.xlsx · 2021–2025.&lt;/dd&gt;
      &lt;dt&gt;Identidad del colegio&lt;/dt&gt;&lt;dd&gt;Municipio + nombre exacto de GIP. Nombres distintos permanecen separados; la exportación no incluye un código institucional utilizable. Un cambio de nombre puede reducir la cobertura histórica aparente.&lt;/dd&gt;
      &lt;dt&gt;Dentro de cada año&lt;/dt&gt;&lt;dd&gt;Las jornadas seleccionadas del mismo nombre se combinan ponderando cada puntaje por sus estudiantes evaluados.&lt;/dd&gt;
      &lt;dt&gt;Entre años&lt;/dt&gt;&lt;dd&gt;Media de los años con datos, con igual peso anual o ponderación por evaluados, según el control. Sin imputar años faltantes.&lt;/dd&gt;
      &lt;dt&gt;Escenario&lt;/dt&gt;&lt;dd&gt;Media de los cinco puntajes con los pesos normalizados elegidos. No es el puntaje global oficial del ICFES.&lt;/dd&gt;
      &lt;dt&gt;TOTAL&lt;/dt&gt;&lt;dd&gt;Suma de los cinco puntajes sin pesos por materia; agregada con el mismo criterio histórico elegido.&lt;/dd&gt;

      &lt;dt&gt;Gráficas&lt;/dt&gt;&lt;dd&gt;Puntos y barras: datos anuales. El detalle sobre un segmento de línea identifica expresamente la interpolación visual; no añade observaciones.&lt;/dd&gt;
      &lt;dt&gt;Alcance de la selección&lt;/dt&gt;&lt;dd&gt;Comparación académica histórica. No incorpora costos, admisiones, bienestar, transporte ni resultados posteriores a 2025.&lt;/dd&gt;
      &lt;dt&gt;Fuente&lt;/dt&gt;&lt;dd&gt;&lt;a href=&quot;https://www.gip.com.co/gipdata/icfes&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;GIP · resultados ICFES&lt;/a&gt;&lt;/dd&gt;
    &lt;/dl&gt;
  &lt;/details&gt;
  &lt;div class=&quot;tooltip&quot; id=&quot;school-tooltip&quot; role=&quot;tooltip&quot; hidden&gt;&lt;/div&gt;
&lt;/div&gt;

const SchoolEngine = (() =&gt; {
  const diurnal = new Set([&#x27;MAÑANA&#x27;,&#x27;TARDE&#x27;,&#x27;COMPLETA&#x27;,&#x27;ÚNICA&#x27;]);
  function normalize(weights) {
    if(weights.length!==5 || weights.some(w=&gt;!Number.isFinite(w)||w&lt;0)) return null;
    const total=weights.reduce((a,b)=&gt;a+b,0);
    return total&gt;0?weights.map(w=&gt;w/total):null;
  }
  const dot=(v,w)=&gt;v.reduce((s,x,i)=&gt;s+x*w[i],0);
  function rank(list,key) {
    const ordered=[...list].sort((a,b)=&gt;b[key]-a[key]||a.name.localeCompare(b.name,&#x27;es&#x27;)||a.id-b.id);
    let rank=0,previous=null;
    return ordered.map((r,i)=&gt;{
      if(previous===null || Math.abs(r[key]-previous)&gt;1e-9) rank=i+1;
      previous=r[key]; return {...r,rank};
    });
  }
  function calculate(data,state,weights,reference=[20,20,20,20,20]) {
    const w=normalize(weights),rw=normalize(reference);
    if(!w||!rw) return {rows:[],error:&#x27;Asigna un peso mayor que cero a una materia.&#x27;};
    const years=[...state.years].sort(),yearSet=new Set(years),townSet=new Set(state.towns);
    if(!years.length||!townSet.size) return {rows:[],error:&#x27;Selecciona al menos un municipio y un año.&#x27;};
    const schools=new Map(data.schools.map(s=&gt;[s.id,s]));
    const groups=new Map(); let sourceCount=0;
    for(const r of data.records) {
      if(!townSet.has(schools.get(r.id).town)||!yearSet.has(r.year)) continue;
      if(state.nature!==&#x27;all&#x27; &amp;&amp; r.nature!==state.nature) continue;
      if(state.session===&#x27;diurnal&#x27; &amp;&amp; !diurnal.has(r.session)) continue;
      if(![&#x27;all&#x27;,&#x27;diurnal&#x27;].includes(state.session) &amp;&amp; r.session!==state.session) continue;
      const key=r.id+&#x27;|&#x27;+r.year;
      if(!groups.has(key)) groups.set(key,{id:r.id,year:r.year,n:0,sums:[0,0,0,0,0],sourceRows:[],sessions:new Set(),natures:new Set()});
      const g=groups.get(key);g.n+=r.n;g.sourceRows.push(r.sourceRow);g.sessions.add(r.session);g.natures.add(r.nature);
      r.scores.forEach((v,i)=&gt;g.sums[i]+=v*r.n);sourceCount++;
    }
    const annual=new Map();
    for(const g of groups.values()) {
      if(g.n&lt;=0) continue;
      if(!annual.has(g.id)) annual.set(g.id,{});
      const scores=g.sums.map(s=&gt;s/g.n);
      annual.get(g.id)[g.year]={year:g.year,n:g.n,scores,score:dot(scores,w),total:scores.reduce((a,b)=&gt;a+b,0),sourceRows:g.sourceRows,sessions:[...g.sessions],natures:[...g.natures]};
    }
    const rows=[];
    for(const [id,byYear] of annual) {
      const entries=Object.values(byYear),coverage=entries.length;
      if(state.complete &amp;&amp; coverage!==years.length) continue;
      const minStudents=Math.min(...entries.map(r=&gt;r.n));
      if(minStudents&lt;state.minStudents) continue;
      const students=entries.reduce((s,r)=&gt;s+r.n,0);
      const denominator=state.aggregation===&#x27;students&#x27;?students:coverage;
      const scores=[0,1,2,3,4].map(j=&gt;entries.reduce((s,r)=&gt;s+r.scores[j]*(state.aggregation===&#x27;students&#x27;?r.n:1),0)/denominator);
      const change=years.length&gt;1 &amp;&amp; byYear[years[0]] &amp;&amp; byYear[years.at(-1)]?byYear[years.at(-1)].score-byYear[years[0]].score:null;
      rows.push({...schools.get(id),byYear,coverage,students,minStudents,scores,score:dot(scores,w),referenceScore:dot(scores,rw),total:scores.reduce((a,b)=&gt;a+b,0),change});
    }
    const ref=new Map(rank(rows,&#x27;referenceScore&#x27;).map(r=&gt;[r.id,r.rank]));
    return {rows:rank(rows,&#x27;score&#x27;).map(r=&gt;({...r,referenceRank:ref.get(r.id),rankChange:ref.get(r.id)-r.rank})),years,weights:w,sourceCount,error:null};
  }
  return {calculate,normalize,dot};
})();
